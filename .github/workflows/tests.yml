name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.11"
            pydantic: ">=2.12.0,<2.13"
            rdflib: ">=7.1.4,<7.2"
          - python-version: "3.12"
            pydantic: ">=2.12.0"
            rdflib: ">=7.1.4"
          - python-version: "3.13"
            pydantic: ">=2.12.0"
            rdflib: ">=7.1.4"
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and set the python version
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - name: Install the project
        run: uv sync --all-groups
      - name: Test dependency combination
        run: uv pip install --upgrade "pydantic${{ matrix.pydantic }}" "rdflib${{ matrix.rdflib }}"
      - name: Run tests
        run: uv run pytest tests --cov=pydantic_rdf --cov-report=xml --cov-fail-under=90